# flight-watch 配置（由网页配置面板生成，与 config.json 保持同步）
# 若环境无 PyYAML 会自动回退读取同目录 config.json。
timezone: Asia/Shanghai
defaults:
  currency: CNY
  hl: zh-CN
  request_interval_seconds: 5
  retry_backoffs_seconds: [15, 40]
  max_retries: 2
routes: []
cross_check:
  source: serpapi
  daily_quota: 3
  deviation_warn_pct: 20
enrich:
  enabled: true
  max_per_run: 3
  which: cheapest_per_route
alerts:
  daily_digest: true
  urgent_single_push: true
  urgent_dedup_hours: 24
  max_urgent_per_day: 5
  new_low_min_pct: 2
  new_low_min_abs: 50
notifiers:
  feishu:
    enabled: true
    secret_env: FEISHU_WEBHOOK
    show_segments: true
  telegram:
    enabled: false
  email:
    enabled: false
dashboard:
  output: docs/data/summary.json
  provider: github_pages
  url: "https://alexli-77.github.io/cheapest-flights/"
hidden_city:
  enabled: true
  origin: YUL
  onward_routes: [BKK, SGN, MNL, DPS, KUL, HAN, SYD, MEL, TPE]
  chinese_hubs: [PEK, PVG, SHA, CAN, SZX, CTU, XMN, HGH, NKG, WUH, CKG, XIY, KMG]
  dates:
    mode: rolling
    depart_in_days: 45
  max_serpapi_per_run: 3
  min_saving_pct: 0
  max_dates_per_onward: 8
  max_direct_lookups: 6
  confirm_only_suspected: true
  cn_carriers: ["Air China", "China Eastern", "China Southern", "Xiamen Air", XiamenAir, "Hainan Airlines", "Shenzhen Airlines", "Sichuan Airlines", "Shanghai Airlines", Juneyao, "Spring Airlines", "Beijing Capital"]
